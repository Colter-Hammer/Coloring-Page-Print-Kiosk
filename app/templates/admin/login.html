{% extends "base_admin.html" %}
{% block title %}Admin Login — Coloring Kiosk{% endblock %}
{% block content %}
<div class="login-shell">
  <div class="login-card card">
    <svg class="login-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="11" width="18" height="11" rx="2" />
      <path d="M7 11V7a5 5 0 0 1 10 0v4" />
    </svg>
    <h2>Admin sign in</h2>
    <p class="page-subtitle">Enter the admin password to manage categories and pages.</p>

    {% if error %}
    <div class="alert alert-error" role="alert">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10" />
        <path d="M12 8v4M12 16h.01" />
      </svg>
      <p>{{ error }}</p>
    </div>
    {% endif %}

    <form method="post" action="/admin/login" class="login-form">
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required autofocus>
      </div>
      <button type="submit" class="btn btn-primary">Log in</button>
    </form>
  </div>
</div>
{% endblock %}
