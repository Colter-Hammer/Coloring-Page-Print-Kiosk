{% macro back_button(href) %}
<button type="button" class="back-button" aria-label="Back" onclick="location.href='{{ href }}'">
  <svg class="back-button-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M19 12H5M12 19l-7-7 7-7" />
  </svg>
</button>
{% endmacro %}
