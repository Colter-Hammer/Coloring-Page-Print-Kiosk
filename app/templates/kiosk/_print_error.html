<div class="print-result">
  <span class="print-result-icon print-result-icon-error">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10" />
      <path d="M12 8v5" />
      <path d="M12 16h.01" />
    </svg>
  </span>
  {% if reason == "rate_limit" %}
  <h2>You've printed a lot already!</h2>
  <p>Ask a grown-up if you want more.</p>
  {% else %}
  <h2>Oops!</h2>
  <p>Ask a grown-up for help.</p>
  {% endif %}
  <div hx-get="/category/{{ page.category_id }}" hx-trigger="load delay:3s" hx-target="#app" hx-swap="innerHTML"></div>
</div>
