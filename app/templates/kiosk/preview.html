{% extends "base_kiosk.html" %}
{% block title %}Preview — Coloring Kiosk{% endblock %}
{% block content %}
<button type="button" class="back-button" aria-label="Back" onclick="location.href='/category/{{ page.category_id }}'">
  <svg class="back-button-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M19 12H5M12 19l-7-7 7-7" />
  </svg>
</button>
<div class="preview">
  <img src="/media/{{ page.image_path }}" alt="" class="preview-image">
  <button
    class="print-button"
    hx-post="/print/{{ page.id }}"
    hx-target="#app"
    hx-swap="innerHTML"
    hx-indicator="#spinner"
  >
    Print
  </button>
  <div id="spinner" class="htmx-indicator">Printing…</div>
</div>
{% endblock %}
