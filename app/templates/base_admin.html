<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Coloring Kiosk Admin{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/admin.css">
</head>
<body>
  <header class="admin-header">
    <a href="/admin" class="admin-header-brand">
      <svg class="admin-header-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 20h9" />
        <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z" />
      </svg>
      <span class="admin-header-title">Coloring Kiosk<span class="admin-header-badge">Admin</span></span>
    </a>
    {% if request.session.get("authenticated") %}
    <form method="post" action="/admin/logout" class="logout-form">
      <button type="submit" class="btn btn-ghost btn-sm">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
          <path d="M16 17l5-5-5-5" />
          <path d="M21 12H9" />
        </svg>
        Log out
      </button>
    </form>
    {% endif %}
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <script src="/static/js/admin.js"></script>
</body>
</html>
